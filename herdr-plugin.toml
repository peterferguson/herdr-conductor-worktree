id = "community.conductor-worktree"
name = "Conductor Worktree"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Create Herdr worktrees under Conductor's workspace directory layout."
platforms = ["linux", "macos"]

[[actions]]
id = "create"
title = "Create Conductor workspace"
contexts = ["pane", "workspace"]
command = ["./dist/index.js", "create"]

[[actions]]
id = "create-registered"
title = "Create registered Conductor workspace"
contexts = ["pane", "workspace"]
command = ["./dist/index.js", "create", "--register-conductor"]

[[actions]]
id = "sync-from-conductor"
title = "Sync Conductor workspaces"
contexts = ["pane", "workspace"]
command = ["./dist/index.js", "sync-from-conductor", "--interactive"]
